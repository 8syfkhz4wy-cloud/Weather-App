name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main, claude/weather-app-daily-psalms-81jrgq]
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *" # alle 2 Stunden: neue Fussball-Top-Meldung

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Neue App-Versionen gehen nur live, wenn alle Tests bestehen. Die regelmässigen Läufe
  # für News und FCB-Daten (Zeitplan, Anstoss durch die Warnungen) ändern die App nicht
  # und laufen ohne Tests, damit die News nie an einem Test hängen bleiben.
  tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  deploy:
    needs: tests
    if: ${{ !cancelled() && needs.tests.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Webseite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html styles.css app.js weather-fx.js fcb-live.js dani-chat.js gta-art.js sw.js psalms.json manifest.webmanifest icons warnungen _site/
          export APP_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          git log -1 --format='%cI%n%s' | python3 -c 'import json,os,sys; d,t=sys.stdin.read().splitlines()[:2]; print(json.dumps({"version": os.environ["APP_VERSION"], "date": d, "title": t}, ensure_ascii=False))' > _site/version.json
      # Fussball-Top-Meldung; schlägt das fehl, bleibt die zuletzt veröffentlichte erhalten
      - name: Fussball-News holen
        run: |
          python3 scripts/fussball_news.py _site/news.json || \
            curl -fsS https://8syfkhz4wy-cloud.github.io/Weather-App/news.json -o _site/news.json || true
      # GTA 6: Tipp des Tages (täglich anderer Schwerpunkt, über den Tag gleich);
      # der zuletzt veröffentlichte Stand dient als Gedächtnis und als Ersatz bei Fehlern
      - name: GTA-6-Tipp holen
        run: |
          curl -fsS https://8syfkhz4wy-cloud.github.io/Weather-App/gta6.json -o /tmp/gta6-prev.json || true
          python3 scripts/gta6_news.py _site/gta6.json /tmp/gta6-prev.json || \
            cp /tmp/gta6-prev.json _site/gta6.json || true
      # FC-Basel-Bereich (Kader, News, fiktiver Kurven-Experte); bei Fehler bleibt der letzte Stand
      - name: FC-Basel-Daten holen
        run: |
          python3 scripts/fcb.py _site/fcb.json || \
            curl -fsS https://8syfkhz4wy-cloud.github.io/Weather-App/fcb.json -o _site/fcb.json || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      # Nur wenn sich die App selbst geändert hat (nicht bei README o. ä.)
      - name: Update-Nachricht senden
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[ohne Nachricht]')
        env:
          BEFORE: ${{ github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && \
             git diff --quiet "$BEFORE" HEAD -- index.html styles.css app.js weather-fx.js fcb-live.js dani-chat.js gta-art.js sw.js psalms.json manifest.webmanifest icons; then
            echo "Keine Änderung an der App – keine Nachricht."
          else
            python3 scripts/update_nachricht.py warnungen/orte.json "$COMMIT_MESSAGE"
          fi

      # Gegenseitiges Anstossen mit den Wetterwarnungen (siehe warnungen.yml)
      - name: Wetterwarnungen mit prüfen
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run warnungen.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" || true
