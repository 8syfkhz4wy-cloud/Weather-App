name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main, claude/weather-app-daily-psalms-81jrgq]
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *" # alle 2 Stunden: neue Fussball-Top-Meldung

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Webseite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html styles.css app.js weather-fx.js sw.js psalms.json manifest.webmanifest icons warnungen _site/
          git log -1 --format='%cI%n%s' | python3 -c 'import json,sys; d,t=sys.stdin.read().splitlines()[:2]; print(json.dumps({"date": d, "title": t}, ensure_ascii=False))' > _site/version.json
      # Fussball-Top-Meldung; schlägt das fehl, bleibt die zuletzt veröffentlichte erhalten
      - name: Fussball-News holen
        run: |
          python3 scripts/fussball_news.py _site/news.json || \
            curl -fsS https://8syfkhz4wy-cloud.github.io/Weather-App/news.json -o _site/news.json || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      # Nur wenn sich die App selbst geändert hat (nicht bei README o. ä.)
      - name: Update-Nachricht senden
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && \
             git diff --quiet "$BEFORE" HEAD -- index.html styles.css app.js weather-fx.js sw.js psalms.json manifest.webmanifest icons; then
            echo "Keine Änderung an der App – keine Nachricht."
          else
            python3 scripts/update_nachricht.py warnungen/orte.json "$COMMIT_MESSAGE"
          fi

      # Gegenseitiges Anstossen mit den Wetterwarnungen (siehe warnungen.yml)
      - name: Wetterwarnungen mit prüfen
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run warnungen.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" || true
