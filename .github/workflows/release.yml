name: Neue Version veröffentlichen

# Startet per Knopfdruck (Actions → Neue Version veröffentlichen → Run workflow, Version
# eingeben) oder wenn ein Versions-Tag wie v1.0.0 hochgeladen wird:
# erstellt das GitHub-Release mit den Hinweisen aus CHANGELOG.md, baut die App mit der
# neuen Versionsnummer neu und schickt eine Push-Nachricht.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer, z. B. v1.1.0 (muss in CHANGELOG.md stehen)"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versionshinweise aus CHANGELOG.md lesen
        run: |
          awk -v tag="## ${TAG}" '$0==tag{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "Keine Hinweise für ${TAG} in CHANGELOG.md"; exit 1; }
          cat notes.md

      # Erstellt bei Bedarf auch den Tag auf dem aktuellen Stand
      - name: GitHub-Release erstellen
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "Wetter & Psalm ${TAG}" --notes-file notes.md

      - name: App mit neuer Versionsnummer veröffentlichen
        run: |
          branch=$(gh api "repos/${{ github.repository }}" --jq .default_branch)
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref "$branch"

      - name: Push-Nachricht senden
        run: |
          version="${TAG#v}"
          python3 scripts/update_nachricht.py warnungen/orte.json "Version ${version} ist da 🎉

          Info: Die neue Version ${version} von Wetter & Psalm ist veröffentlicht. Ganz unten auf der Wetter-Seite siehst du die Versionsnummer."
