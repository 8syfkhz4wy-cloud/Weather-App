name: Wetterwarnungen

on:
  schedule:
    - cron: "17 * * * *" # stündlich
  workflow_dispatch:
    inputs:
      test:
        description: "Testnachricht an alle Orte senden"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: warnungen

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # Merkt sich, welche Warnungen schon verschickt wurden
      - uses: actions/cache/restore@v4
        with:
          path: status.json
          key: warnungen-status-${{ github.run_id }}
          restore-keys: warnungen-status-

      # Wache: GitHub startet zeitgesteuerte Abläufe oft nur wenige Male am Tag (Lücken bis 12 Std.).
      # Deshalb läuft dieser Ablauf gut 5 Stunden lang: alle 30 Minuten Warnungen prüfen, ein
      # bevorstehendes FCB-Spiel rechtzeitig an fcb-live.yml übergeben und alle 2 Stunden die
      # Fussball-News aktualisieren. Danach startet er seinen Nachfolger (unten).
      - name: Wache (Warnungen, FCB-Spiele, News)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          TEST: ${{ inputs.test && '--test' || '' }}
        run: |
          if [ -n "$TEST" ]; then python3 scripts/warnungen.py warnungen/orte.json status.json --test; exit; fi
          end=$((SECONDS + 330 * 60)); round=0
          while :; do
            echo "::group::$(TZ=Europe/Zurich date '+%a %H:%M')"
            python3 scripts/warnungen.py warnungen/orte.json status.json || echo "Warnungen: Fehler, nächster Versuch in 30 Min."
            if python3 scripts/fcb_live.py warnungen/orte.json --bald; then
              open=$(gh run list --repo "$REPO" --workflow fcb-live.yml --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length' || echo 0)
              if [ "$open" = "0" ]; then echo "FCB-Spiel steht an: Live-Ticker starten"; gh workflow run fcb-live.yml --repo "$REPO" --ref "$REF" || true; fi
            fi
            if [ $((round % 4)) = 0 ]; then gh workflow run pages.yml --repo "$REPO" --ref "$REF" || true; fi
            round=$((round + 1))
            echo "::endgroup::"
            [ $SECONDS -ge $end ] && break
            sleep 1800
          done

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: status.json
          key: warnungen-status-${{ github.run_id }}

      # GitHub pausiert zeitgesteuerte Abläufe nach 60 Tagen ohne Änderungen
      # am Repository. Das erneute Aktivieren hält Warnungen und News am Laufen.
      - name: Ablauf aktiv halten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/warnungen.yml/enable" || true
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable" || true
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fcb-live.yml/enable" || true

      # Nachfolger starten, damit die Wache ohne Lücke weiterläuft. Ein Lauf, der schon
      # wartet (concurrency), wird dabei ersetzt, so läuft immer nur eine Wache.
      - name: Nächste Wache starten
        if: ${{ !inputs.test }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run warnungen.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" || true
