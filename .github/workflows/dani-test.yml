name: Dani-Sprüche testen

# Lässt manuell Danis Sprüche über GitHub Models schreiben und zeigt sie im Protokoll.
# Veröffentlicht nichts; die App bekommt neue Sprüche über pages.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: FCB-Schlagzeilen holen
        run: curl -fsS https://8syfkhz4wy-cloud.github.io/Weather-App/fcb.json -o fcb.json || echo '{}' > fcb.json
      - name: Diagnose (vorübergehend)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          B='{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Sag Hoi."}],"max_tokens":20}'
          echo "== curl catalog"; curl -sS -i -m 30 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://models.github.ai/catalog/models | head -c 900; echo
          echo "== curl chat"; curl -sS -i -m 60 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -d "$B" https://models.github.ai/inference/chat/completions | head -c 1500; echo
          echo "== curl chat http1.1"; curl -sS -i --http1.1 -m 60 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$B" https://models.github.ai/inference/chat/completions | head -c 900; echo
          echo "== curl ohne Token"; curl -sS -i -m 30 https://models.github.ai/catalog/models | head -c 500; echo
          echo "== azure"; curl -sS -i -m 60 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Sag Hoi."}],"max_tokens":20}' https://models.inference.ai.azure.com/chat/completions | head -c 900; echo
          env | grep -i -E "proxy|^GITHUB_API|RUNNER_ENV" || true
      - name: Sprüche schreiben lassen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/dani_ki.py fcb.json dani.json
      - name: Ergebnis zeigen
        run: cat dani.json
